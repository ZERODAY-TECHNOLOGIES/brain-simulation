# Neurochemical agent parameters.
# Values come from the spec (docs/spec) unless marked "ours, not in spec".
# Times are in ticks. 1 tick = 1 generated token.

time:
  ticks_per_second: 10        # idle time conversion
  impulse_spread_ticks: 10    # impulses are spread evenly over this many ticks

concentration:
  baseline: 1.0               # all substances are normalized so b = 1.0
  min: 0.0
  max: 5.0

# Half-life in ticks. ADO does not decay while awake; 1500 applies during sleep only.
half_life:
  NE: 40
  ACh: 60
  DA: 100
  GABA: 150
  OXT: 1000
  5-HT: 2000
  CORT: 8000
  GH: 12000
  MEL: 18000
  ADO: 1500

# W, per tick. Effect of the source's deviation from baseline on the target.
# The slow OXT, 5-HT, CORT loops are scaled by 0.4: with the spec values -K + W is unstable (D-20).
interactions:
  - { from: GABA, to: NE,   w: -0.01 }
  - { from: NE,   to: GABA, w: 0.004 }
  - { from: GABA, to: DA,   w: -0.003 }
  - { from: 5-HT, to: NE,   w: -0.002 }
  - { from: DA,   to: ACh,  w: 0.002 }
  - { from: ADO,  to: NE,   w: -0.001 }
  - { from: MEL,  to: NE,   w: -0.0005 }
  - { from: ADO,  to: DA,   w: -0.0005 }
  - { from: CORT, to: 5-HT, w: -0.0002 }    # spec -0.0005, x0.4 (D-20)
  - { from: OXT,  to: 5-HT, w: 0.0002 }     # spec 0.0005, x0.4 (D-20)
  - { from: CORT, to: DA,   w: -0.0003 }
  - { from: CORT, to: OXT,  w: -0.00012 }   # spec -0.0003, x0.4 (D-20)
  - { from: NE,   to: CORT, w: 0.0002 }
  - { from: OXT,  to: CORT, w: -0.00008 }   # spec -0.0002, x0.4 (D-20)
  - { from: CORT, to: GH,   w: -0.0002 }
  - { from: 5-HT, to: CORT, w: -0.00004 }   # spec -0.0001, x0.4 (D-20)

# Tolerance: receptor density rho follows the long-term mean C-bar.
receptors:
  tau_avg: 5000
  tau_rho: 20000
  gamma: 0.5
  rho_min: 0.3
  rho_max: 1.5

# Output channels. m_k = sum of Delta over terms, divided by 1 + gaba_gain * max(0, C_GABA - 1).
# Term defaults: ec50 = 1.0, n = 1.5 (ours, not in spec). Emax values are ours; the spec gives signs only.
# shape: hill (default) or inverted_u with a peak concentration.
modulation:
  gaba_gain: 1.0              # ours, not in spec
  channels:
    # E1 steering directions. Computed and shown, not applied in reduced mode.
    calm_anxious:
      - { substance: 5-HT, emax: 0.5 }
      - { substance: GABA, emax: 0.5 }
      - { substance: CORT, emax: -0.5 }
      - { substance: NE,   emax: -0.5 }
    curious_apathetic:
      - { substance: DA,   emax: 0.5 }
      - { substance: ACh,  emax: 0.5 }
      - { substance: CORT, emax: -0.5 }
      - { substance: ADO,  emax: -0.5 }
    focused_distracted:
      - { substance: NE,   emax: 0.5, shape: inverted_u, peak: 1.3 }
      - { substance: ACh,  emax: 0.5 }
      - { substance: ADO,  emax: -0.5 }
    warm_cold:
      - { substance: OXT,  emax: 0.5 }
      - { substance: 5-HT, emax: 0.5 }
      - { substance: CORT, emax: -0.5 }
    cautious_bold:
      - { substance: CORT, emax: 0.5 }
      - { substance: 5-HT, emax: 0.5 }
      - { substance: DA,   emax: -0.5 }
    energetic_tired:
      - { substance: DA,   emax: 0.5 }
      - { substance: NE,   emax: 0.5 }
      - { substance: ADO,  emax: -0.5 }
      - { substance: MEL,  emax: -0.5 }
    # E3 plasticity (m_plast). Computed and shown, not applied in reduced mode.
    plasticity:
      - { substance: DA,   emax: 1.5 }
      - { substance: ACh,  emax: 0.5 }
      - { substance: CORT, emax: -0.5 }
    # E4 exports to the memory module.
    memory_encoding:
      - { substance: ACh,  emax: 0.5 }
      - { substance: DA,   emax: 0.5 }
      - { substance: NE,   emax: 0.5 }
    memory_noise:
      - { substance: NE,   emax: 0.5 }
    memory_retrieval_threshold:
      - { substance: CORT, emax: 0.5 }
    memory_consolidation:
      - { substance: DA,   emax: 0.5 }

# Appraisal. Only effort is used so far; the rest arrives in Phase 3.
appraisal:
  effort_gain: 0.001          # ADO += effort_gain * tokens generated in the response

# Circadian clock and pineal gland. Hours are clock hours, 0 to 24.
circadian:
  dark_start: 21.0
  dark_end: 7.0
  ramp_hours: 1.0             # darkness ramps up and down over this long at both ends
  light_minutes: 30           # a user message counts as light for this long
  jet_lag_shift_minutes: 15   # clock delay after a night with repeated light
  jet_lag_light_minutes: 60   # ours, not in spec: light needed in one dark window to count as "repeated"
  melatonin_production: 3.85e-5  # ours, not in spec: p_max per tick, settles MEL near 2.0 in full darkness
  cortisol_night: 0.6         # ours, not in spec: CORT target from dark start until the rise
  cortisol_rise_start: 3.0    # CORT rises linearly from here to dark_end
  cortisol_awakening: 1.5     # CORT peak after a natural wake (+50%), reached by secretion over the next minutes
  cortisol_awakening_minutes: 30

# Sleep decision and architecture.
sleep:
  onset_pressure: 2.0         # fall asleep when P > this, P = (ADO - b) - C(phi) (D-21)
  onset_melatonin: 1.5        # and MEL > this
  onset_idle_minutes: 10      # and the user has been idle this long
  forced_adenosine: 5.0       # fall asleep regardless when ADO reaches this (the clamp max)
  wake_adenosine_rise: 3.8e-6 # ours, not in spec: ADO per awake tick, so a quiet day ends in sleep near 23:00 (D-23)
  wake_pressure: 0.5          # wake naturally when P < this and the dark window is over
  cycle_minutes: 90
  n1_fraction: 0.05
  n3_fraction_start: 0.40
  n3_fraction_step: -0.09     # per cycle
  rem_fraction_start: 0.10
  rem_fraction_step: 0.08     # per cycle
  # Baseline targets b_i per phase. Substances not listed keep their resting baseline.
  # CORT and MEL follow the clock, not the phase.
  phase_targets:
    N1:  { NE: 0.6,  5-HT: 0.7,  ACh: 0.6, DA: 0.9, GH: 1.0 }
    N2:  { NE: 0.4,  5-HT: 0.5,  ACh: 0.4, DA: 0.8, GH: 1.5 }
    N3:  { NE: 0.2,  5-HT: 0.4,  ACh: 0.2, DA: 0.7, GH: 3.0 }
    REM: { NE: 0.05, 5-HT: 0.05, ACh: 1.4, DA: 1.1, GH: 1.0 }
